spring.application.name=call-script-system

# Tests use an isolated in-memory DB so they never touch the real data file.
spring.datasource.url=jdbc:h2:mem:call-script-system-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
