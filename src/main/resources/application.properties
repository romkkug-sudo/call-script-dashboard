spring.application.name=call-script-system

# このPCでは8080番がDocker等に使われていることが多いため、既定を8081に変更。
server.port=8081

# H2 file-based storage: data persists under ./data/callscript.mv.db across restarts.
spring.datasource.url=jdbc:h2:file:./data/callscript
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
